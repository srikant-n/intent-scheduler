[package]
name = "intent-scheduler"
version = "0.1.0"
description = "Personal intent vs reality task and time tracker"
authors = ["Intent Scheduler"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "intent_scheduler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
